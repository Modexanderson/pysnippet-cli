[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pysnippet-cli"
version = "0.1.0"
description = "Local GPU-accelerated code snippet search using embeddings — find code by meaning, not just text."
readme = "README.md"
license = "MIT"
authors = [
    { name = "Mordecai Shekwogaza", email = "mordecai.a.d@gmail.com" },
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Utilities",
]
dependencies = [
    "click>=8.1",
    "sentence-transformers>=2.2",
    "numpy>=1.24",
]

[project.urls]
Homepage = "https://github.com/modexanderson/pysnippet-cli"
Repository = "https://github.com/modexanderson/pysnippet-cli"
Issues = "https://github.com/modexanderson/pysnippet-cli/issues"

[project.scripts]
pysnippet = "pysnippet_cli.cli:main"

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pysnippet_cli"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
